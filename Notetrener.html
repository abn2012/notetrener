.lvb{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:5px 12px;font-weight:800;font-size:14px}

.lv .cnt{text-align:center;font-weight:800;min-width:60px;font-size:15px;color:var(--mut)}.lv .cnt b{font-size:28px;color:var(--ok);line-height:1}.lv .cnt small{font-size:10px;font-weight:600}
.mv{transform-origin:50% 95%}.mv.wig{animation:wig 1.2s ease-in-out infinite}.mv.hop{animation:hop .8s ease-in-out infinite}.mv.sway{animation:sway 2s ease-in-out infinite}

function intro(i){const l=PATH[i];window.scrollTo(0,0);
$('#app').innerHTML=`<div class="stk"><button class="x" onclick="path()">‹ Tilbake</button></div><h1 style="margin:10px 0 4px">${i+1}. ${l.n}</h1>${info(l)}<button class="btn" onclick="start(${i},1)">Start lekse</button>`}
function showNotes(){const o=document.createElement('div');o.className='nov';o.innerHTML=`<div class="nbox"><div class="stk"><button class="x" onclick="closeNotes()">‹ Tilbake til leksjonen</button></div><h2 style="margin:6px 0">${G.l.n}</h2>${info(G.l)}<button class="btn" onclick="closeNotes()">Tilbake til leksjonen</button></div>`;document.body.appendChild(o)}
function closeNotes(){const o=document.querySelector('.nov');if(o)o.remove()}
const TUT=[
{ic:'note',h:'Velkommen!',t:'Her lærer du å lese noter på en gøy måte. Vil du ha en kjapp omvisning?'},
{ic:'note',h:'Slik spiller du',t:'Du ser en note på notelinjene. Trykk på bokstaven som passer: C, D, E, F, G, A eller H. Du hører også tonen, og kan trykke på notene for å høre den igjen.'},
{ic:'map',h:'Læringsløypa',t:'Start her! Leksjonene tar deg steg for steg fra de første notene til begge nøklene. Klarer du en leksjon, åpnes den neste, og du får opptil 3 stjerner.'},
{ic:'bolt',h:'Fire nivåer',t:'Vil du øve fritt? Velg Lett, Middels, Vanskelig eller Ekspert. Jo vanskeligere nivå, jo mer XP får du, opptil 2x.'},
{ic:'flame',h:'Streak',t:'Fullfør minst én runde hver dag for å holde streaken i live. Hvor mange dager på rad klarer du?'},
{ic:'egg',h:'Egg, kister og dyr',t:'XP-en bruker du i Egg- og Kiste-fanen. Klekk gårdsdyr og dinosaurer, åpne kister med instrumenter, og gi dyrene instrumentene sine. Har du 3 av samme dyr, kan det bevege seg!'},
{ic:'star',h:'Klar?',t:'Det var alt! Du finner omvisningen igjen med ?-knappen, og tannhjulet lar deg bytte farge og skru lyd av og på.'}];
function tutor(i){let o=document.querySelector('.tut');if(!o){o=document.createElement('div');o.className='tut';document.body.appendChild(o)}
const t=TUT[i],last=i===TUT.length-1;
o.innerHTML=`<div class="tbox"><div class="tic">${ic(t.ic,64)}</div><h2>${t.h}</h2><p>${t.t}</p>${i>0?`<div class="dots">${TUT.slice(1).map((_,k)=>`<i class="${k+1===i?'on':''}"></i>`).join('')}</div>`:''}<button class="btn" onclick="${last?'tutEnd()':`tutor(${i+1})`}">${i===0?'Vis meg rundt':last?'Kom i gang':'Neste'}</button>${i===0?'<button class="btn g" onclick="tutEnd()">Nei takk</button>':last?'':'<button class="btn g" onclick="tutEnd()">Hopp over</button>'}${i>1?`<button class="x" style="margin-top:10px" onclick="tutor(${i-1})">‹ Tilbake</button>`:''}</div>`}
function tutEnd(){S.tut=1;save();const o=document.querySelector('.tut');if(o)o.remove()}
function rng(c,l){return l.c.length>1?(c==='t'?[26,40]:[16,30]):[l.lo,l.hi]}
function tot(){const l=G.l;return l.c.reduce((s,k)=>s+pl(k,l).length,0)}
function fan(){[28,32,35,39,42].forEach((n,i)=>setTimeout(()=>beep(n,true),i*120))}
function party(big,msg){const o=document.createElement('div');o.className='ov';const C=['#ff4d6d','#ffb703','#2ed585','#4dabf7','#9b7bff','#ff8a1f'];let h='';
for(let i=0;i<(big?90:50);i++)h+=`<i class="cf" style="left:${Math.random()*100}%;background:${C[i%6]};animation-duration:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.8}s"></i>`;
for(let i=0;i<(big?40:16);i++)h+=`<span class="st" style="left:${Math.random()*100}%;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s">${ic(i%3?'star':'sparkle',18+Math.floor(Math.random()*20))}</span>`;
if(big){const R=['#ef4565','#ff8a1f','#ffd23f','#2ed585','#4dabf7','#7c4dff','#c64dff'];let g='transparent 0 calc(var(--w)*.2)';R.forEach((c,k)=>{g+=`,${c} calc(var(--w)*${(.2+k*.04).toFixed(2)}) calc(var(--w)*${(.24+k*.04).toFixed(2)})`});g+=',transparent 0';h+=`<div class="rb" style="background:radial-gradient(circle at 50% 100%,${g})"></div>`}
h+=`<div class="ban">${msg}</div>`;o.innerHTML=h;document.body.appendChild(o);setTimeout(()=>o.remove(),5000)}
function cheer(){if(!G.p&&RUN.seen.size>=tot()){party(1,'ALLE NOTENE!');fan();RUN.seen.clear()}else if(RUN.combo%10===0){party(0,RUN.combo+' på rad!');fan()}}
function start(i,p){window.scrollTo(0,0);const l=p?PATH[i]:LV[i],key=(p?'p':'')+i;if(!RUN||RUN.i!==key)RUN={i:key,combo:0,seen:new Set()};G={i,p,l,Q:p?Math.min(10,Math.max(5,l.c.reduce((s,k)=>s+pl(k,l).length,0)*2)):10,q:0,ok:0,hp:3,max:0,xp:0,cur:null,busy:false,tm:null};next()}
function next(){const l=G.l;if(!RUN.bag||!RUN.bag.length){const a=[];l.c.forEach(c=>pl(c,l).forEach(n=>a.push({n,c})));if(l.nw)l.nw.forEach(([c,n])=>a.push({n,c}));
for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
const t=a[a.length-1];if(G.cur&&a.length>1&&t.n===G.cur.n&&t.c===G.cur.c)a.unshift(a.pop());RUN.bag=a}
G.cur=RUN.bag.pop();G.busy=false;draw()}
function staff(n,c){const base=c==='t'?30:18,y=90-(n-base)*5,x=170;let s='';
for(let k=0;k<5;k++)s+=`<line x1="20" x2="280" y1="${50+k*10}" y2="${50+k*10}" stroke="currentColor" stroke-width="1.6"/>`;
for(let ly=100;ly<=y+.1;ly+=10)s+=`<line x1="${x-16}" x2="${x+16}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="1.6"/>`;
for(let ly=40;ly>=y-.1;ly-=10)s+=`<line x1="${x-16}" x2="${x+16}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="1.6"/>`;
const up=y>70;s+=`<line x1="${up?x+6:x-6}" x2="${up?x+6:x-6}" y1="${y}" y2="${up?y-32:y+32}" stroke="currentColor" stroke-width="2"/>`;
s+=`<ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.5" transform="rotate(-20 ${x} ${y})" style="fill:var(--pri)" stroke="currentColor" stroke-width="1.2"/>`;
s+=c==='t'?`<path d="M28 100C28 105 37 106 37 98L40 38C41 28 48 26 48 34C48 44 36 54 30 66C24 78 30 88 40 88C50 88 52 76 44 72C37 69 31 76 35 81" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:`<g fill="currentColor"><circle cx="30" cy="60" r="5"/><circle cx="58" cy="55" r="2.800"/><circle cx="58" cy="65" r="2.800"/><path d="M30 55 C48 54 52 70 44 80 C38 87 30 91 22 94" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/></g>`;
return`<svg viewBox="0 0 300 150" role="img" aria-label="Note"><g transform="translate(0,5)">${s}</g></svg>`}
function draw(){const{q,hp,cur,l}=G,combo=RUN.combo;
$('#app').innerHTML=`<div class="hud"><span><button class="x" onclick="${G.p?'path()':'home()'}">‹ Tilbake</button>${G.p&&!G.l.t?' <button class="x" onclick="showNotes()">Noter</button>':''}</span><span>${G.p?'<b>Lekse '+(G.i+1)+'</b>':ic('heart',24).repeat(hp)+ic('heartO',24).repeat(3-hp)}</span><span>${combo>1?ic('flame',20)+' x'+combo:''}</span><span>${q}/${G.Q}</span></div>
<div class="bar"><i style="width:${q*100/G.Q}%"></i></div>${G.p?'':`<div class="center" style="font-size:12px;color:var(--mut)">${ic('rainbow',14)} ${RUN.seen.size}/${tot()} noter på rad</div>`}
${l.t?'<div class="bar"><i id="tb" style="background:var(--hot);width:100%"></i></div>':''}
<div class="card" id="st" onclick="playNote()">${staff(cur.n,cur.c)}<div class="bub" id="bub">Trykk for å høre tonen</div></div><div class="msg" id="msg">Hvilken note er dette?</div>
<div class="keys">${N.map((k,i)=>`<button onclick="ans(${i},this)">${k}</button>`).join('')}</div>`;
if(l.t){const b=$('#tb');b.style.transition='none';b.offsetWidth;b.style.transition=`width ${l.t}s linear`;b.style.width='0';
clearTimeout(G.tm);G.tm=setTimeout(()=>ans(-1),l.t*1000)}playNote()}
function ans(i,btn){if(G.busy)return;G.busy=true;clearTimeout(G.tm);const r=G.cur.n%7,ok=i===r;
const ks=document.querySelectorAll('.keys button');ks[r].classList.add('ok');if(!ok&&btn)btn.classList.add('bad');
const m=$('#msg');G.q++;
if(ok){G.ok++;RUN.combo++;RUN.seen.add(G.cur.c+G.cur.n);G.max=Math.max(G.max,RUN.combo);addXp(10+Math.min(RUN.combo,5));
m.textContent=['Riktig!','Bra!','Strålende!','Fantastisk!'][Math.min(RUN.combo-1,3)];$('#st').classList.add('flash');cheer()}
else{if(!G.p)G.hp--;RUN.combo=0;RUN.seen.clear();m.textContent=(i<0?'Tiden gikk ut! ':G.p?'Ikke helt! ':'Oi! ')+'Det var '+N[r];if(G.p){const bb=$('#bub');if(bb)bb.textContent='Riktig svar: '+N[r]}}
if(!ok){if(G.p)tone(G.cur.n);else beep(G.cur.n,false)}save();
setTimeout(()=>{(G.hp<=0||G.q>=G.Q)?end():next()},ok?650:(G.p?2200:1300))}
function end(){window.scrollTo(0,0);const win=G.p?G.ok>=Math.ceil(G.Q/2):G.hp>0,st=!win?0:G.ok>=G.Q?3:G.ok>=G.Q*.8?2:1;
if(G.ok>=5||win)tick();addXp(st*5);if(G.p&&win)S.path[G.i]=Math.max(S.path[G.i]||0,st);if(G.p&&win&&!S.pathDone&&PATH.every((_,k)=>S.path[k])){S.pathDone=true;S.xp+=2000;S.tot+=2000;G.xp+=2000;G.done=1;setTimeout(()=>{party(0,'Hele løypa er klar! +2000 XP');fan()},400);setTimeout(()=>{party(0,'');fan()},2600)}save();
$('#app').innerHTML=`<div class="rowi">${win?ic('star',64).repeat(st):ic(G.p?'note':'heartO',64)}</div><h1 class="center">${win?'Runden er klar!':'Prøv igjen!'}</h1>
${G.done?'<div class="msg" style="font-size:18px;color:var(--ok)">Du klarte hele løypa! +2000 XP</div>':''}<div class="top"><div class="pill">${G.ok}/${G.q}<small>riktige</small></div><div class="pill">${ic('flame',18)} ${G.max}<small>beste kombo</small></div><div class="pill">+${G.xp}<small>XP · ${G.l.m}x</small></div></div>
<div class="note">${S.xp>=500?'Du har nok XP til et egg!':'XP til neste egg: '+(500-S.xp)}</div>
${G.p&&win&&PATH[G.i+1]?`<button class="btn" onclick="intro(${G.i+1})">Neste lekse</button>`:''}<button class="btn${G.p&&win&&PATH[G.i+1]?' g':''}" onclick="start(${G.i},${G.p?1:0})">Spill igjen</button><button class="btn g" onclick="${G.p?'path()':'home()'}">${G.p?'Til løypa':'Til forsiden'}</button>`}
home();
if(!S.tut)tutor(0);
</script></body></html>
