# Serverer appen, og sender /api/ videre til lagringsserveren (tjenesten «api» i docker-compose.yml).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Navnet slås opp først når noen spør. Da starter appen selv om lagringsserveren mangler.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 256k;
    }
}
