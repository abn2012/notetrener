const t=a[a.length-1];if(G.cur&&a.length>1&&t.n===G.cur.n&&t.c===G.cur.c)a.unshift(a.pop());RUN.bag=a}
G.cur=RUN.bag.pop()}
G.ord=l.sh?shuf(R(0,6)):R(0,6);G.busy=false;draw()}
const CLEF={t:`<path d="M28 100C28 105 37 106 37 98L40 38C41 28 48 26 48 34C48 44 36 54 30 66C24 78 30 88 40 88C50 88 52 76 44 72C37 69 31 76 35 81" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`,b:`<g fill="currentColor"><circle cx="30" cy="60" r="5"/><circle cx="58" cy="55" r="2.800"/><circle cx="58" cy="65" r="2.800"/><path d="M30 55 C48 54 52 70 44 80 C38 87 30 91 22 94" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/></g>`};
// n kan være én note eller en liste (akkord). hide viser bare et spørsmålstegn (gehør).
function staff(n,c,hide){const ns=[].concat(n),base=c==='t'?30:18,ys=ns.map(v=>90-(v-base)*5),lo=Math.max(...ys),hi=Math.min(...ys),x=170;let s='';
for(let k=0;k<5;k++)s+=`<line x1="20" x2="280" y1="${50+k*10}" y2="${50+k*10}" stroke="currentColor" stroke-width="1.6"/>`;
if(hide)s+=`<text x="${x}" y="85" text-anchor="middle" font-size="44" font-weight="900" style="fill:var(--pri)">?</text>`;
else{for(let ly=100;ly<=lo+.1;ly+=10)s+=`<line x1="${x-16}" x2="${x+16}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="1.6"/>`;
for(let ly=40;ly>=hi-.1;ly-=10)s+=`<line x1="${x-16}" x2="${x+16}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="1.6"/>`;
const up=(lo+hi)/2>70;s+=`<line x1="${up?x+6:x-6}" x2="${up?x+6:x-6}" y1="${up?lo:hi}" y2="${up?hi-32:lo+32}" stroke="currentColor" stroke-width="2"/>`;
ys.forEach(y=>s+=`<ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.5" transform="rotate(-20 ${x} ${y})" style="fill:var(--pri)" stroke="currentColor" stroke-width="1.2"/>`)}
s+=CLEF[c];
return`<svg viewBox="0 0 300 150" role="img" aria-label="Note"><g transform="translate(0,5)">${s}</g></svg>`}
function hud(){const{q,hp}=G,combo=RUN.combo;return`<div class="hud"><span><button class="x" onclick="${G.p?'path()':'home()'}">‹ Tilbake</button>${G.p?' <button class="x" onclick="showNotes()">Noter</button>':''}</span><span>${G.p?'<b>Leksjon '+(G.i+1)+'</b>':ic('heart',24).repeat(hp)+ic('heartO',24).repeat(3-hp)}</span><span>${combo>1?ic('flame',20)+' x'+combo:''}</span><span>${q}/${G.Q}</span></div>
<div class="bar"><i style="width:${q*100/G.Q}%"></i></div>${fpet()}${G.p||G.l.chord?'':`<div class="center" style="font-size:12px;color:var(--mut)">${ic('rainbow',14)} ${RUN.seen.size}/${tot()} noter på rad</div>`}`}
function draw(){if(G.l.place)return drawPlace();const{cur,l}=G,k=cur.k,tl=k==='ear'&&l.t?15:l.t;
$('#app').innerHTML=`${hud()}
${tl?'<div class="bar"><i id="tb" style="background:var(--hot);width:100%"></i></div>':''}
<div class="card" id="st" onclick="playNote()">${k==='chord'?staff([cur.n,cur.n+2,cur.n+4],'t'):staff(cur.n,cur.c,k==='ear')}<div class="bub" id="bub">${k==='ear'?'Trykk for å høre igjen':'Trykk for å høre tonen'}</div></div><div class="msg" id="msg">${k==='ear'?'Lytt! Hvilken tone kommer etter C?':k==='chord'?'Hvilken akkord er dette?':'Hvilken note er dette?'}</div>
<div class="keys">${G.ord.map(i=>`<button data-i="${i}" onclick="ans(${i},this)">${N[i]}</button>`).join('')}</div>`;
if(tl){const b=$('#tb');b.style.transition='none';b.offsetWidth;b.style.transition=`width ${tl}s linear`;b.style.width='0';
clearTimeout(G.tm);G.tm=setTimeout(()=>ans(-1),tl*1000)}playNote()}
// Plasser noten: notelinja tegnes dobbelt så høy, så den er lett å treffe med fingeren.
function pr(){const c=G.cur.c,base=c==='t'?30:18,P=pl(c,G.l);return{c,base,lo:Math.min(...P,base),hi:Math.max(...P,base+8)}}
function bigStaff(){const{c,base,lo,hi}=pr(),Y=v=>20+(hi-v)*10,H=(hi-lo)*10+40,x=190,r=G.cur.n%7;let s='';
for(let k=0;k<5;k++){const y=Y(base+2*k);s+=`<line x1="14" x2="290" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="2"/>`}
s+=`<g transform="translate(-16 ${Y(base+8)-100}) scale(2)">${CLEF[c]}</g>`;
const head=(v,col,op)=>{const y=Y(v);let h='';for(let ly=Y(base)+20;ly<=y+.1;ly+=20)h+=`<line x1="${x-22}" x2="${x+22}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="2"/>`;
for(let ly=Y(base+8)-20;ly>=y-.1;ly-=20)h+=`<line x1="${x-22}" x2="${x+22}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="2"/>`;
return h+`<ellipse cx="${x}" cy="${y}" rx="12" ry="8.5" transform="rotate(-20 ${x} ${y})" style="fill:${col}" opacity="${op||1}" stroke="currentColor" stroke-width="1.5"/>`};
if(G.show)R(lo,hi).filter(v=>v%7===r&&v!==G.pos).forEach(v=>s+=head(v,'var(--ok)',.6));
if(G.pos!=null)s+=head(G.pos,G.show===2?'var(--bad)':G.show===1?'var(--ok)':'var(--pri)');
return`<svg viewBox="0 0 300 ${H}" role="img" aria-label="Notelinje" style="touch-action:manipulation">${s}</svg>`}
function drawPlace(){const r=G.cur.n%7;
$('#app').innerHTML=`${hud()}<div class="msg" id="msg" style="font-size:22px">Hvor er ${N[r]}?</div><div class="card" id="st" onclick="placeTap(event)">${bigStaff()}</div>
<div class="keys pk"><button onclick="nudge(1)" aria-label="Flytt opp">▲</button><button onclick="nudge(-1)" aria-label="Flytt ned">▼</button><button id="chk" onclick="check()" disabled>Sjekk</button></div><div class="note" style="margin-top:10px">Trykk på notelinja, og bruk pilene for å flytte noten.</div>`}
function setPos(v){const{lo,hi}=pr();G.pos=Math.max(lo,Math.min(hi,v));$('#st').innerHTML=bigStaff();$('#chk').disabled=false;tone(G.pos)}
function placeTap(e){if(G.busy)return;const b=$('#st svg').getBoundingClientRect(),{lo,hi}=pr(),H=(hi-lo)*10+40;setPos(Math.round(hi-((e.clientY-b.top)/b.height*H-20)/10))}
function nudge(d){if(G.busy)return;setPos(G.pos==null?pr().base+4:G.pos+d)}
function check(){if(G.busy||G.pos==null)return;ans(G.pos%7===G.cur.n%7?G.cur.n%7:-2)}
// i: svaret (0-6), -1 = tiden gikk ut, -2 = feil plassering
function ans(i,btn){if(G.busy)return;G.busy=true;clearTimeout(G.tm);const r=G.cur.n%7,ok=i===r,pm=G.l.place;
if(pm){G.show=ok?1:2;$('#st').innerHTML=bigStaff();$('#chk').disabled=true}
else{const kb=document.querySelector(`.keys button[data-i="${r}"]`);if(kb)kb.classList.add('ok');if(!ok&&btn)btn.classList.add('bad')}
const m=$('#msg'),fp=$('#fp');G.q++;if(fp){fp.classList.remove('jump','sad');fp.offsetWidth;fp.classList.add(ok?'jump':'sad')}
if(ok){G.ok++;RUN.combo++;if(!G.cur.k)RUN.seen.add(G.cur.c+G.cur.n);G.max=Math.max(G.max,RUN.combo);addXp(10+Math.min(RUN.combo,5));dqAdd('ok',1);dqAdd('combo',RUN.combo);
m.textContent=['Riktig!','Bra!','Strålende!','Fantastisk!'][Math.min(RUN.combo-1,3)];$('#st').classList.add('flash');cheer()}
else{if(!G.p)G.hp--;RUN.combo=0;RUN.seen.clear();m.textContent=pm?(G.p?'Ikke helt! ':'Oi! ')+'De grønne notene er '+N[r]:(i===-1?'Tiden gikk ut! ':G.p?'Ikke helt! ':'Oi! ')+'Det var '+N[r];if(G.p&&!pm){const bb=$('#bub');if(bb)bb.textContent='Riktig svar: '+N[r]}}
if(!ok){if(G.p||pm)tone(G.cur.n);else beep(G.cur.n,false)}save();
setTimeout(()=>{(G.hp<=0||G.q>=G.Q)?end():next()},ok?650:(G.p||pm?2200:1300))}
function end(){window.scrollTo(0,0);const win=G.p?G.ok>=Math.ceil(G.Q/2):G.hp>0,st=!win?0:G.ok>=G.Q?3:G.ok>=G.Q*.8?2:1;
if(G.ok>=5||win)tick();addXp(st*5);if(win){dqAdd('rounds',1);if(!G.p&&G.hp===3)dqAdd('perfect',1)}const PM=[];if(G.p&&win){S.path[G.i]=Math.max(S.path[G.i]||0,st);G.bn=BONUS.filter(b=>!S.bn[b.k]&&b.L.every(k=>S.path[k]));G.bn.forEach(b=>{S.bn[b.k]=1;S.xp+=b.xp;S.tot+=b.xp;G.xp+=b.xp;PM.push(b.t+' +'+b.xp+' XP')});
if(!S.pathDone&&PATH.every((_,k)=>S.path[k])){S.pathDone=true;S.pets.ele=(S.pets.ele||0)+1;S.xp+=2000;S.tot+=2000;G.xp+=2000;G.done=1;PM.push('Hele løypa er klar! +2000 XP','')}}
PM.forEach((m,j)=>setTimeout(()=>{party(0,m);fan()},400+j*2200));setTimeout(eggHint,1500+PM.length*2200);save();
$('#app').innerHTML=`<div class="rowi">${win?ic('star',64).repeat(st):ic(G.p?'note':'heartO',64)}</div><h1 class="center">${win?'Runden er klar!':'Prøv igjen!'}</h1>
${(G.bn||[]).map(b=>`<div class="msg" style="font-size:18px;color:var(--ok)">${b.t} +${b.xp} XP</div>`).join('')}${G.done?`<div class="msg" style="font-size:18px;color:var(--ok)">Du klarte hele løypa! +2000 XP</div><div class="pop" style="margin:0">${pet('ele',120)}</div><div class="msg">Du fikk en studentelefant!</div>`:''}<div class="top"><div class="pill">${G.ok}/${G.q}<small>riktige</small></div><div class="pill">${ic('flame',18)} ${G.max}<small>beste kombo</small></div><div class="pill">+${G.xp}<small>XP · ${G.l.m}x</small></div></div>
<div class="note">${goal().txt}</div>
${G.p&&win&&PATH[G.i+1]?`<button class="btn" onclick="intro(${G.i+1})">Neste leksjon</button>`:''}<button class="btn${G.p&&win&&PATH[G.i+1]?' g':''}" onclick="start(${G.i},${G.mode})">Spill igjen</button><button class="btn g" onclick="${G.p?'path()':'home()'}">${G.p?'Til løypa':'Til forsiden'}</button>`}
new MutationObserver(()=>{updWheel();if(document.querySelector('.nav'))setTimeout(eggHint,600)}).observe($('#app'),{childList:true});
home();
</script></body></html>
