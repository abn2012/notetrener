g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+1.8);

function ov(c,arr,nw){const base=c==='t'?30:18,k=arr.length,x0=8,dx=(292-x0)/k;let s='';
for(let q=0;q<5;q++)s+=`<line x1="4" x2="296" y1="${50+q*10}" y2="${50+q*10}" stroke="currentColor" stroke-width="1.2"/>`;
arr.forEach((n,i)=>{const y=90-(n-base)*5,x=x0+dx*(i+.5),w=Math.min(8,dx/2);
for(let ly=100;ly<=y+.1;ly+=10)s+=`<line x1="${x-w}" x2="${x+w}" y1="${ly}" y2="${ly}" stroke="currentColor"/>`;
for(let ly=40;ly>=y-.1;ly-=10)s+=`<line x1="${x-w}" x2="${x+w}" y1="${ly}" y2="${ly}" stroke="currentColor"/>`;
const nn=nw.has(n);s+=`<ellipse cx="${x}" cy="${y}" rx="5.500" ry="4" transform="rotate(-20 ${x} ${y})" style="fill:${nn?'var(--pri)':'currentColor'}"/><text x="${x}" y="128" text-anchor="middle" font-size="12" font-weight="800" style="fill:${nn?'var(--pri)':'currentColor'}">${N[n%7]}</text>`});
return`<svg viewBox="0 25 300 110">${s}</svg>`}
function info(l){const nm={t:'Diskantnøkkel',b:'Bassnøkkel'};
return`<div class="note" style="text-align:left">${l.tip}</div>${l.nw.length?`<div class="msg">Nye noter</div><div class="note">Trykk på en note for å høre den</div><div class="grid">${l.nw.map(([c,n])=>`<div class="card center" style="margin:0" onclick="tone(${n})">${staff(n,c)}<b style="font-size:22px">${N[n%7]}${c==='t'&&n<30?'¹':''}</b></div>`).join('')}</div>`:''}
<div class="msg" style="margin-top:12px">Disse notene kommer</div>${l.c.map(c=>`<div class="note" style="margin:4px 0 0">${nm[c]}</div><div class="card" style="margin:4px 0">${ov(c,l.pool[c],new Set(l.nw.filter(x=>x[0]===c).map(x=>x[1])))}</div>`).join('')}${l.nw.length?'<div class="note">Lilla noter er nye. De andre kjenner du fra før.</div>':''}`}
function intro(i){const l=PATH[i];window.scrollTo(0,0);
$('#app').innerHTML=`<div class="stk"><button class="x" onclick="path()">‹ Tilbake</button></div><h1 style="margin:10px 0 4px">${i+1}. ${l.n}</h1>${info(l)}<button class="btn" onclick="start(${i},1)">Start leksjonen</button>`}
function showNotes(){const o=document.createElement('div');o.className='nov';o.innerHTML=`<div class="nbox"><div class="stk"><button class="x" onclick="closeNotes()">‹ Tilbake til leksjonen</button></div><h2 style="margin:6px 0">${G.l.n}</h2>${info(G.l)}<button class="btn" onclick="closeNotes()">Tilbake til leksjonen</button></div>`;document.body.appendChild(o)}
function closeNotes(){const o=document.querySelector('.nov');if(o)o.remove()}
const TUT=[
{ic:'note',h:'Velkommen!',t:'Her lærer du å lese noter på en gøy måte. Vil du ha en kjapp omvisning?'},
{ic:'note',h:'Slik spiller du',t:'Du ser en note på notelinjene. Trykk på bokstaven som passer: C, D, E, F, G, A eller H. Du hører også tonen, og kan trykke på notene for å høre den igjen.'},
{ic:'map',h:'Læringsløypa',t:'Start her! Leksjonene tar deg steg for steg fra de første notene til begge nøklene. Klarer du en leksjon, åpnes den neste, og du får opptil 3 stjerner.'},
{ic:'bolt',h:'Seks nivåer',t:'Vil du øve fritt? Velg et nivå fra Lett til Legendarisk. På Mester er bokstavene stokket, og på Legendarisk får du også toner på gehør. Akkorder har sin egen økt med 2x XP. Jo vanskeligere nivå, jo mer XP, opptil 3x.'},
{ic:'note',h:'Plasser noten',t:'Her får du en bokstav, og så plasserer du noten selv på notelinja. Trykk på linja, og bruk pilene for å finjustere.'},
{ic:'flame',h:'Streak',t:'Fullfør minst én runde hver dag for å holde streaken i live. Ryker den, kan du redde den med XP, men det blir dyrere for hver gang.'},
{ic:'egg',h:'Egg, kister og dyr',t:'XP-en bruker du i Egg- og Kiste-fanen. Klekk gårdsdyr, dinosaurer, fugler og overraskelsesdyr, og åpne kister med instrumenter. Samler du alle i en gruppe, får du et merke. Har du 3 av samme dyr, kan det danse og snurre!'},
{ic:'sparkle',h:'Overraskelser',t:'Hver dag får du en ny utfordring med XP i belønning. Av og til er et dyr du klekker skinnende, og da glitrer det! Dyrene dine kan heie på deg underveis, og når du har klart leksjon 4 kan du spille melodier.'},
{ic:'star',h:'Klar?',t:'Det var alt! Du finner omvisningen igjen med ?-knappen, og tannhjulet lar deg bytte farge og skru lyd av og på.'}];
function tutor(i){let o=document.querySelector('.tut');if(!o){o=document.createElement('div');o.className='tut';document.body.appendChild(o)}
const t=TUT[i],last=i===TUT.length-1;
o.innerHTML=`<div class="tbox"><div class="tic">${ic(t.ic,64)}</div><h2>${t.h}</h2><p>${t.t}</p>${i>0?`<div class="dots">${TUT.slice(1).map((_,k)=>`<i class="${k+1===i?'on':''}"></i>`).join('')}</div>`:''}<button class="btn" onclick="${last?'tutEnd()':`tutor(${i+1})`}">${i===0?'Vis meg rundt':last?'Kom i gang':'Neste'}</button>${i===0?'<button class="btn g" onclick="tutEnd()">Nei takk</button>':last?'':'<button class="btn g" onclick="tutEnd()">Hopp over</button>'}${i>1?`<button class="x" style="margin-top:10px" onclick="tutor(${i-1})">‹ Tilbake</button>`:''}</div>`}
function tutEnd(){S.tut=1;save();const o=document.querySelector('.tut');if(o)o.remove()}
function rng(c,l){if(l.r)return l.r[c];return l.c.length>1?(c==='t'?[26,40]:[16,30]):[l.lo,l.hi]}
function tot(){const l=G.l;return l.c.reduce((s,k)=>s+pl(k,l).length,0)}
function fan(){[28,32,35,39,42].forEach((n,i)=>setTimeout(()=>beep(n,true),i*120))}
function party(big,msg){const o=document.createElement('div');o.className='ov';const C=['#ff4d6d','#ffb703','#2ed585','#4dabf7','#9b7bff','#ff8a1f'];let h='';
for(let i=0;i<(big?90:50);i++)h+=`<i class="cf" style="left:${Math.random()*100}%;background:${C[i%6]};animation-duration:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.8}s"></i>`;
for(let i=0;i<(big?40:16);i++)h+=`<span class="st" style="left:${Math.random()*100}%;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s">${ic(i%3?'star':'sparkle',18+Math.floor(Math.random()*20))}</span>`;
if(big){const R=['#ef4565','#ff8a1f','#ffd23f','#2ed585','#4dabf7','#7c4dff','#c64dff'];let g='transparent 0 calc(var(--w)*.2)';R.forEach((c,k)=>{g+=`,${c} calc(var(--w)*${(.2+k*.04).toFixed(2)}) calc(var(--w)*${(.24+k*.04).toFixed(2)})`});g+=',transparent 0';h+=`<div class="rb" style="--g:radial-gradient(circle at 50% 100%,${g})"></div>`}
h+=`<div class="ban">${msg}</div>`;o.innerHTML=h;document.body.appendChild(o);setTimeout(()=>o.remove(),5000)}
function cheer(){if(!G.p&&RUN.seen.size>=tot()){party(1,'ALLE NOTENE!');fan();RUN.seen.clear()}else if(RUN.combo%10===0){party(0,RUN.combo+' på rad!');fan()}else if(RUN.combo%5===0)cheerPet()}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// p: 0 = nivå, 1 = læringsløype, 2 = plasser noten, 3 = akkorder
function start(i,p){p=p||0;window.scrollTo(0,0);const l=[LV,PATH,PL,AK][p][i],key='lpqa'[p]+i;if(!RUN||RUN.i!==key)RUN={i:key,combo:0,seen:new Set()};G={i,p:p===1,mode:p,l,Q:p===1?Math.min(10,Math.max(5,l.c.reduce((s,k)=>s+pl(k,l).length,0)*2)):10,q:0,ok:0,hp:3,max:0,xp:0,cur:null,busy:false,tm:null,pos:null,show:0};next()}
function next(){const l=G.l,x=Math.random();G.pos=null;G.show=0;
if(l.ear&&x<l.ear)G.cur={n:28+Math.floor(Math.random()*7),c:'t',k:'ear'};
else if(l.chord&&x<(l.ear||0)+l.chord)G.cur={n:28+Math.floor(Math.random()*8),c:'t',k:'chord'};
else{if(!RUN.bag||!RUN.bag.length){const a=[];l.c.forEach(c=>pl(c,l).forEach(n=>a.push({n,c})));if(l.nw)l.nw.forEach(([c,n])=>a.push({n,c}));shuf(a);
const t=a[a.length-1];if(G.cur&&a.length>1&&t.n===G.cur.n&&t.c===G.cur.c)a.unshift(a.pop());RUN.bag=a}
G.cur=RUN.bag.pop()}
G.ord=l.sh?shuf(R(0,6)):R(0,6);G.busy=false;draw()}
const CLEF={t:`<path d="M28 100C28 105 37 106 37 98L40 38C41 28 48 26 48 34C48 44 36 54 30 66C24 78 30 88 40 88C50 88 52 76 44 72C37 69 31 76 35 81" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`,b:`<g fill="currentColor"><circle cx="30" cy="60" r="5"/><circle cx="58" cy="55" r="2.800"/><circle cx="58" cy="65" r="2.800"/><path d="M30 55 C48 54 52 70 44 80 C38 87 30 91 22 94" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/></g>`};
// n kan være én note eller en liste (akkord). hide viser bare et spørsmålstegn (gehør).
function staff(n,c,hide){const ns=[].concat(n),base=c==='t'?30:18,ys=ns.map(v=>90-(v-base)*5),lo=Math.max(...ys),hi=Math.min(...ys),x=170;let s='';
for(let k=0;k<5;k++)s+=`<line x1="20" x2="280" y1="${50+k*10}" y2="${50+k*10}" stroke="currentColor" stroke-width="1.6"/>`;
if(hide)s+=`<text x="${x}" y="85" text-anchor="middle" font-size="44" font-weight="900" style="fill:var(--pri)">?</text>`;
else{for(let ly=100;ly<=lo+.1;ly+=10)s+=`<line x1="${x-16}" x2="${x+16}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="1.6"/>`;
for(let ly=40;ly>=hi-.1;ly-=10)s+=`<line x1="${x-16}" x2="${x+16}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="1.6"/>`;
const up=(lo+hi)/2>70;s+=`<line x1="${up?x+6:x-6}" x2="${up?x+6:x-6}" y1="${up?lo:hi}" y2="${up?hi-32:lo+32}" stroke="currentColor" stroke-width="2"/>`;
ys.forEach(y=>s+=`<ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.5" transform="rotate(-20 ${x} ${y})" style="fill:var(--pri)" stroke="currentColor" stroke-width="1.2"/>`)}
s+=CLEF[c];
return`<svg viewBox="0 0 300 150" role="img" aria-label="Note"><g transform="translate(0,5)">${s}</g></svg>`}
function hud(){const{q,hp}=G,combo=RUN.combo;return`<div class="hud"><span><button class="x" onclick="${G.p?'path()':'home()'}">‹ Tilbake</button>${G.p?' <button class="x" onclick="showNotes()">Noter</button>':''}</span><span>${G.p?'<b>Leksjon '+(G.i+1)+'</b>':ic('heart',24).repeat(hp)+ic('heartO',24).repeat(3-hp)}</span><span>${combo>1?ic('flame',20)+' x'+combo:''}</span><span>${q}/${G.Q}</span></div>
<div class="bar"><i style="width:${q*100/G.Q}%"></i></div>${fpet()}${G.p||G.l.chord?'':`<div class="center" style="font-size:12px;color:var(--mut)">${ic('rainbow',14)} ${RUN.seen.size}/${tot()} noter på rad</div>`}`}
function draw(){if(G.l.place)return drawPlace();const{cur,l}=G,k=cur.k,tl=k==='ear'&&l.t?15:l.t;
$('#app').innerHTML=`${hud()}
${tl?'<div class="bar"><i id="tb" style="background:var(--hot);width:100%"></i></div>':''}
<div class="card" id="st" onclick="playNote()">${k==='chord'?staff([cur.n,cur.n+2,cur.n+4],'t'):staff(cur.n,cur.c,k==='ear')}<div class="bub" id="bub">${k==='ear'?'Trykk for å høre igjen':'Trykk for å høre tonen'}</div></div><div class="msg" id="msg">${k==='ear'?'Lytt! Hvilken tone kommer etter C?':k==='chord'?'Hvilken akkord er dette?':'Hvilken note er dette?'}</div>
<div class="keys">${G.ord.map(i=>`<button data-i="${i}" onclick="ans(${i},this)">${N[i]}</button>`).join('')}</div>`;
if(tl){const b=$('#tb');b.style.transition='none';b.offsetWidth;b.style.transition=`width ${tl}s linear`;b.style.width='0';
clearTimeout(G.tm);G.tm=setTimeout(()=>ans(-1),tl*1000)}playNote()}
// Plasser noten: notelinja tegnes dobbelt så høy, så den er lett å treffe med fingeren.
function pr(){const c=G.cur.c,base=c==='t'?30:18,P=pl(c,G.l);return{c,base,lo:Math.min(...P,base),hi:Math.max(...P,base+8)}}
function bigStaff(){const{c,base,lo,hi}=pr(),Y=v=>20+(hi-v)*10,H=(hi-lo)*10+40,x=190,r=G.cur.n%7;let s='';
for(let k=0;k<5;k++){const y=Y(base+2*k);s+=`<line x1="14" x2="290" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="2"/>`}
s+=`<g transform="translate(-16 ${Y(base+8)-100}) scale(2)">${CLEF[c]}</g>`;
const head=(v,col,op)=>{const y=Y(v);let h='';for(let ly=Y(base)+20;ly<=y+.1;ly+=20)h+=`<line x1="${x-22}" x2="${x+22}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="2"/>`;
for(let ly=Y(base+8)-20;ly>=y-.1;ly-=20)h+=`<line x1="${x-22}" x2="${x+22}" y1="${ly}" y2="${ly}" stroke="currentColor" stroke-width="2"/>`;
return h+`<ellipse cx="${x}" cy="${y}" rx="12" ry="8.5" transform="rotate(-20 ${x} ${y})" style="fill:${col}" opacity="${op||1}" stroke="currentColor" stroke-width="1.5"/>`};
if(G.show)R(lo,hi).filter(v=>v%7===r&&v!==G.pos).forEach(v=>s+=head(v,'var(--ok)',.6));
if(G.pos!=null)s+=head(G.pos,G.show===2?'var(--bad)':G.show===1?'var(--ok)':'var(--pri)');
return`<svg viewBox="0 0 300 ${H}" role="img" aria-label="Notelinje" style="touch-action:manipulation">${s}</svg>`}
function drawPlace(){const r=G.cur.n%7;
$('#app').innerHTML=`${hud()}<div class="msg" id="msg" style="font-size:22px">Hvor er ${N[r]}?</div><div class="card" id="st" onclick="placeTap(event)">${bigStaff()}</div>
<div class="keys pk"><button onclick="nudge(1)" aria-label="Flytt opp">▲</button><button onclick="nudge(-1)" aria-label="Flytt ned">▼</button><button id="chk" onclick="check()" disabled>Sjekk</button></div><div class="note" style="margin-top:10px">Trykk på notelinja, og bruk pilene for å flytte noten.</div>`}
function setPos(v){const{lo,hi}=pr();G.pos=Math.max(lo,Math.min(hi,v));$('#st').innerHTML=bigStaff();$('#chk').disabled=false;tone(G.pos)}
function placeTap(e){if(G.busy)return;const b=$('#st svg').getBoundingClientRect(),{lo,hi}=pr(),H=(hi-lo)*10+40;setPos(Math.round(hi-((e.clientY-b.top)/b.height*H-20)/10))}
function nudge(d){if(G.busy)return;setPos(G.pos==null?pr().base+4:G.pos+d)}
function check(){if(G.busy||G.pos==null)return;ans(G.pos%7===G.cur.n%7?G.cur.n%7:-2)}
// i: svaret (0-6), -1 = tiden gikk ut, -2 = feil plassering
function ans(i,btn){if(G.busy)return;G.busy=true;clearTimeout(G.tm);const r=G.cur.n%7,ok=i===r,pm=G.l.place;
if(pm){G.show=ok?1:2;$('#st').innerHTML=bigStaff();$('#chk').disabled=true}
else{const kb=document.querySelector(`.keys button[data-i="${r}"]`);if(kb)kb.classList.add('ok');if(!ok&&btn)btn.classList.add('bad')}
const m=$('#msg'),fp=$('#fp');G.q++;if(fp){fp.classList.remove('jump','sad');fp.offsetWidth;fp.classList.add(ok?'jump':'sad')}
if(ok){G.ok++;RUN.combo++;if(!G.cur.k)RUN.seen.add(G.cur.c+G.cur.n);G.max=Math.max(G.max,RUN.combo);addXp(10+Math.min(RUN.combo,5));dqAdd('ok',1);dqAdd('combo',RUN.combo);
m.textContent=['Riktig!','Bra!','Strålende!','Fantastisk!'][Math.min(RUN.combo-1,3)];$('#st').classList.add('flash');cheer()}
else{if(!G.p)G.hp--;RUN.combo=0;RUN.seen.clear();m.textContent=pm?(G.p?'Ikke helt! ':'Oi! ')+'De grønne notene er '+N[r]:(i===-1?'Tiden gikk ut! ':G.p?'Ikke helt! ':'Oi! ')+'Det var '+N[r];if(G.p&&!pm){const bb=$('#bub');if(bb)bb.textContent='Riktig svar: '+N[r]}}
if(!ok){if(G.p||pm)tone(G.cur.n);else beep(G.cur.n,false)}save();
setTimeout(()=>{(G.hp<=0||G.q>=G.Q)?end():next()},ok?650:(G.p||pm?2200:1300))}
function end(){window.scrollTo(0,0);const win=G.p?G.ok>=Math.ceil(G.Q/2):G.hp>0,st=!win?0:G.ok>=G.Q?3:G.ok>=G.Q*.8?2:1;
if(G.ok>=5||win)tick();addXp(st*5);if(win){dqAdd('rounds',1);if(!G.p&&G.hp===3)dqAdd('perfect',1)}const PM=[];if(G.p&&win){S.path[G.i]=Math.max(S.path[G.i]||0,st);G.bn=BONUS.filter(b=>!S.bn[b.k]&&b.L.every(k=>S.path[k]));G.bn.forEach(b=>{S.bn[b.k]=1;S.xp+=b.xp;S.tot+=b.xp;G.xp+=b.xp;PM.push(b.t+' +'+b.xp+' XP')});
if(!S.pathDone&&PATH.every((_,k)=>S.path[k])){S.pathDone=true;S.xp+=2000;S.tot+=2000;G.xp+=2000;G.done=1;PM.push('Hele løypa er klar! +2000 XP','')}}
PM.forEach((m,j)=>setTimeout(()=>{party(0,m);fan()},400+j*2200));save();
$('#app').innerHTML=`<div class="rowi">${win?ic('star',64).repeat(st):ic(G.p?'note':'heartO',64)}</div><h1 class="center">${win?'Runden er klar!':'Prøv igjen!'}</h1>
${(G.bn||[]).map(b=>`<div class="msg" style="font-size:18px;color:var(--ok)">${b.t} +${b.xp} XP</div>`).join('')}${G.done?'<div class="msg" style="font-size:18px;color:var(--ok)">Du klarte hele løypa! +2000 XP</div>':''}<div class="top"><div class="pill">${G.ok}/${G.q}<small>riktige</small></div><div class="pill">${ic('flame',18)} ${G.max}<small>beste kombo</small></div><div class="pill">+${G.xp}<small>XP · ${G.l.m}x</small></div></div>
<div class="note">${goal().txt}</div>
${G.p&&win&&PATH[G.i+1]?`<button class="btn" onclick="intro(${G.i+1})">Neste leksjon</button>`:''}<button class="btn${G.p&&win&&PATH[G.i+1]?' g':''}" onclick="start(${G.i},${G.mode})">Spill igjen</button><button class="btn g" onclick="${G.p?'path()':'home()'}">${G.p?'Til løypa':'Til forsiden'}</button>`}
home();
if(!S.tut)tutor(0);
</script></body></html>
